server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /data/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /data/index.json {
        expires off;
        add_header Cache-Control "no-cache";
    }
    location ~ \.(html|js|css|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
}
